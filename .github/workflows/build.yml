name: Windows build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check tag version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag does not match VERSION' }
      - name: Build, test, and package
        shell: powershell
        run: ./scripts/build.ps1 -Package
      - uses: actions/upload-artifact@v4
        with:
          name: Windows-release
          path: |
            artifacts/release/*.zip
            artifacts/release/SHA256SUMS.txt
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME artifacts/release/*.zip artifacts/release/SHA256SUMS.txt --verify-tag --title "Discord DM Cleaner $env:GITHUB_REF_NAME" --notes-file docs/RELEASE-NOTES.md
